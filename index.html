<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اسأل — مساعد المعرفة الإسلامية</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:#f4f1ea;color:#1f2a24;line-height:1.8}
.wrap{max-width:680px;margin:0 auto;padding:24px 16px}
h1{font-size:1.6rem;margin:8px 0 4px;color:#14532d}
.sub{color:#5b6b61;margin-bottom:20px}
textarea{width:100%;min-height:90px;padding:12px;font:inherit;border:1px solid #cfd8d0;border-radius:12px;resize:vertical}
button{margin-top:10px;background:#14532d;color:#fff;border:0;border-radius:12px;padding:12px 28px;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.6}
.card{background:#fff;border-radius:14px;padding:16px 18px;margin-top:18px;box-shadow:0 1px 4px #0001}
.verdict{border-right:5px solid #14532d;background:#ecf6ef}
.card h3{margin:0 0 6px;font-size:1rem;color:#14532d}
.card p,.card li{margin:4px 0}
.card ul{margin:4px 0;padding-right:20px}
.note{font-size:.85rem;color:#6b7a70;margin-top:24px}
a{color:#14532d}
</style>
</head>
<body>
<div class="wrap">
  <h1>اسأل</h1>
  <div class="sub">اكتب سؤالك بالعامية، هتلاقي الحكم في سطرين وبعدها التفاصيل والمصادر.</div>
  <textarea id="q" placeholder="مثلا: هل حديث «النظافة من الإيمان» صحيح؟"></textarea>
  <button id="go">اسأل</button>
  <div id="out"></div>
  <div class="note">تنبيه: ده مساعد آلي ممكن يغلط، مش مفتي. راجع المصادر، وفي الأمور المهمة اسأل عالم تثق فيه أو دار الإفتاء.</div>
</div>
<script>
const out=document.getElementById('out'),btn=document.getElementById('go'),q=document.getElementById('q');
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function parse(t){
  const sec={};let cur=null;
  for(const line of t.split('\n')){
    const m=line.match(/^#+\s*(الحكم|التفاصيل|المصادر)/);
    if(m){cur=m[1];sec[cur]='';continue}
    if(cur)sec[cur]+=line+'\n';
  }
  return Object.keys(sec).length?sec:{'التفاصيل':t};
}
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')}
function fmt(body){
  let h='',inList=false;
  for(const raw of body.trim().split('\n')){
    const line=raw.trim();
    const m=line.match(/^[*-]\s+(.*)$/);
    if(m){if(!inList){h+='<ul>';inList=true}h+='<li>'+inline(m[1])+'</li>';continue}
    if(inList){h+='</ul>';inList=false}
    if(line)h+='<p>'+inline(line)+'</p>';
  }
  if(inList)h+='</ul>';
  return h;
}
function card(title,body,cls){return `<div class="card ${cls||''}"><h3>${title}</h3>${fmt(body)}</div>`}
async function ask(){
  const question=q.value.trim();if(!question)return;
  btn.disabled=true;out.innerHTML='<div class="card">بدوّر وبراجع المصادر...</div>';
  try{
    const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'خطأ');
    const s=parse(d.text);let h='';
    if(s['الحكم'])h+=card('الحكم',s['الحكم'],'verdict');
    if(s['التفاصيل'])h+=card('التفاصيل',s['التفاصيل']);
    if(s['المصادر'])h+=card('المصادر',s['المصادر']);
    if(d.links&&d.links.length){
      const seen=new Set();
      h+='<div class="card"><h3>روابط بحث</h3><ul>'+d.links.filter(l=>!seen.has(l.uri)&&seen.add(l.uri)).map(l=>`<li><a href="${encodeURI(l.uri)}" target="_blank" rel="noopener">${esc(l.title||l.uri)}</a></li>`).join('')+'</ul></div>';
    }
    out.innerHTML=h;
  }catch(e){out.innerHTML=`<div class="card">${esc(e.message)}</div>`}
  btn.disabled=false;
}
btn.onclick=ask;
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))ask()});
</script>
</body>
</html>
